plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.csro'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}

// CI finds ordinary unit tests while the standard test task retains its local behavior.
tasks.register('ciUnitTest', Test) {
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	exclude '**/*IntegrationTest*.class', '**/*LiveTest*.class', '**/BackendApplicationTests.class'
}

tasks.register('ciPostgresTest', Test) {
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.csro.backend.booking.BookingApiIntegrationTest'
		includeTestsMatching 'com.csro.backend.reconfirmation.BookingReconfirmationEvidenceIntegrationTest'
	}
	doFirst {
		def url = providers.environmentVariable('BOOKING_RECONFIRMATION_TEST_DB_URL').orNull
		def password = providers.environmentVariable('BOOKING_RECONFIRMATION_TEST_DB_PASSWORD').orNull
		if (url != 'jdbc:postgresql://127.0.0.1:25433/yeohaengbom_reconfirmation_test'
				|| !password || providers.environmentVariable('BOOKING_RECONFIRMATION_EVIDENCE_TEST').orNull != 'true') {
			throw new GradleException('CI PostgreSQL tests require the dedicated loopback test database.')
		}

		// Override the local profile for both JDBC and Flyway before Spring starts.
		systemProperties([
			'spring.config.on-not-found': 'ignore',
			'spring.datasource.url': url,
			'spring.datasource.username': 'yb',
			'spring.datasource.password': password,
			'spring.flyway.url': url,
			'spring.flyway.user': 'yb',
			'spring.flyway.password': password
		])
	}
}
